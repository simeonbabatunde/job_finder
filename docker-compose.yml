services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - SMTP_EMAIL=${SMTP_EMAIL}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FRONTEND_URL=${FRONTEND_URL}
      - APP_ENV=${APP_ENV:-development}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:-job-finder-dev-secret-change-me}
      - AUTH_PREVIOUS_SECRET_KEYS=${AUTH_PREVIOUS_SECRET_KEYS:-}
      - AUTH_ACCESS_TOKEN_TTL_SECONDS=${AUTH_ACCESS_TOKEN_TTL_SECONDS:-3600}
      - AUTH_REFRESH_TOKEN_TTL_SECONDS=${AUTH_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      - APP_DATA_ENCRYPTION_KEY=${APP_DATA_ENCRYPTION_KEY:-}
      - FREE_DAILY_AGENT_RUN_LIMIT=${FREE_DAILY_AGENT_RUN_LIMIT:-3}
      - PRO_DAILY_AGENT_RUN_LIMIT=${PRO_DAILY_AGENT_RUN_LIMIT:-50}
      - FILL_REVIEW_ARTIFACT_DIR=${FILL_REVIEW_ARTIFACT_DIR:-storage/fill_review_artifacts}
      - FILL_REVIEW_ARTIFACT_RETENTION_DAYS=${FILL_REVIEW_ARTIFACT_RETENTION_DAYS:-14}
      - USE_ALEMBIC_MIGRATIONS=${USE_ALEMBIC_MIGRATIONS:-false}
      - AGENT_RUNNER_MODE=${AGENT_RUNNER_MODE:-worker}
      - AGENT_WORKER_POLL_SECONDS=${AGENT_WORKER_POLL_SECONDS:-2}
      - AGENT_RUN_STALE_MINUTES=${AGENT_RUN_STALE_MINUTES:-120}
      - ENABLE_TRUE_AUTO_SUBMIT=${ENABLE_TRUE_AUTO_SUBMIT:-false}
    depends_on:
      - db

  worker:
    build: ./backend
    command: uv run python -m app.worker
    volumes:
      - ./backend:/app
      - /app/.venv
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - SMTP_EMAIL=${SMTP_EMAIL}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FRONTEND_URL=${FRONTEND_URL}
      - APP_ENV=${APP_ENV:-development}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:-job-finder-dev-secret-change-me}
      - AUTH_PREVIOUS_SECRET_KEYS=${AUTH_PREVIOUS_SECRET_KEYS:-}
      - AUTH_ACCESS_TOKEN_TTL_SECONDS=${AUTH_ACCESS_TOKEN_TTL_SECONDS:-3600}
      - AUTH_REFRESH_TOKEN_TTL_SECONDS=${AUTH_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      - APP_DATA_ENCRYPTION_KEY=${APP_DATA_ENCRYPTION_KEY:-}
      - FREE_DAILY_AGENT_RUN_LIMIT=${FREE_DAILY_AGENT_RUN_LIMIT:-3}
      - PRO_DAILY_AGENT_RUN_LIMIT=${PRO_DAILY_AGENT_RUN_LIMIT:-50}
      - FILL_REVIEW_ARTIFACT_DIR=${FILL_REVIEW_ARTIFACT_DIR:-storage/fill_review_artifacts}
      - FILL_REVIEW_ARTIFACT_RETENTION_DAYS=${FILL_REVIEW_ARTIFACT_RETENTION_DAYS:-14}
      - USE_ALEMBIC_MIGRATIONS=${USE_ALEMBIC_MIGRATIONS:-false}
      - AGENT_RUNNER_MODE=worker
      - AGENT_WORKER_POLL_SECONDS=${AGENT_WORKER_POLL_SECONDS:-2}
      - AGENT_RUN_STALE_MINUTES=${AGENT_RUN_STALE_MINUTES:-120}
      - ENABLE_TRUE_AUTO_SUBMIT=${ENABLE_TRUE_AUTO_SUBMIT:-false}
    depends_on:
      - db

  frontend:
    build: ./frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - backend

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"

volumes:
  postgres_data:
