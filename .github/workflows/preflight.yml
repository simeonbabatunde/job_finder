name: Preflight

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PREFLIGHT_COMPOSE_DOWN_ON_EXIT: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run launch preflight
        run: ./scripts/preflight.sh
