services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    build: ./backend
    restart: unless-stopped
    command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    expose:
      - "8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
      APP_ENV: ${APP_ENV:-production}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?set AUTH_SECRET_KEY}
      AUTH_PREVIOUS_SECRET_KEYS: ${AUTH_PREVIOUS_SECRET_KEYS:-}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-3600}
      AUTH_REFRESH_TOKEN_TTL_SECONDS: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      APP_DATA_ENCRYPTION_KEY: ${APP_DATA_ENCRYPTION_KEY:?set APP_DATA_ENCRYPTION_KEY}
      APP_DATA_PREVIOUS_ENCRYPTION_KEYS: ${APP_DATA_PREVIOUS_ENCRYPTION_KEYS:-}
      FREE_DAILY_AGENT_RUN_LIMIT: ${FREE_DAILY_AGENT_RUN_LIMIT:-3}
      PRO_DAILY_AGENT_RUN_LIMIT: ${PRO_DAILY_AGENT_RUN_LIMIT:-50}
      FILL_REVIEW_ARTIFACT_DIR: ${FILL_REVIEW_ARTIFACT_DIR:-storage/fill_review_artifacts}
      FILL_REVIEW_ARTIFACT_RETENTION_DAYS: ${FILL_REVIEW_ARTIFACT_RETENTION_DAYS:-14}
      USE_ALEMBIC_MIGRATIONS: ${USE_ALEMBIC_MIGRATIONS:-true}
      AGENT_RUNNER_MODE: worker
      AGENT_WORKER_POLL_SECONDS: ${AGENT_WORKER_POLL_SECONDS:-2}
      AGENT_WORKER_HEARTBEAT_SECONDS: ${AGENT_WORKER_HEARTBEAT_SECONDS:-10}
      AGENT_WORKER_HEARTBEAT_STALE_SECONDS: ${AGENT_WORKER_HEARTBEAT_STALE_SECONDS:-30}
      AGENT_RUN_STALE_MINUTES: ${AGENT_RUN_STALE_MINUTES:-120}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      PRO_PLAN_PRICE_LABEL: ${PRO_PLAN_PRICE_LABEL:-$$10/mo}
      BILLING_SUCCESS_URL: ${BILLING_SUCCESS_URL:-}
      BILLING_CANCEL_URL: ${BILLING_CANCEL_URL:-}
      BILLING_PORTAL_RETURN_URL: ${BILLING_PORTAL_RETURN_URL:-}
      ENABLE_TRUE_AUTO_SUBMIT: ${ENABLE_TRUE_AUTO_SUBMIT:-false}
      TRUE_SUBMIT_PILOT_USER_EMAILS: ${TRUE_SUBMIT_PILOT_USER_EMAILS:-}
      TRUE_SUBMIT_PILOT_ATS_TYPES: ${TRUE_SUBMIT_PILOT_ATS_TYPES:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      SMTP_EMAIL: ${SMTP_EMAIL:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI:-}
    volumes:
      - fill_review_artifacts:/app/storage/fill_review_artifacts
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "app.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL}
      APP_ENV: ${APP_ENV:-production}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?set AUTH_SECRET_KEY}
      AUTH_PREVIOUS_SECRET_KEYS: ${AUTH_PREVIOUS_SECRET_KEYS:-}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-3600}
      AUTH_REFRESH_TOKEN_TTL_SECONDS: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      APP_DATA_ENCRYPTION_KEY: ${APP_DATA_ENCRYPTION_KEY:?set APP_DATA_ENCRYPTION_KEY}
      APP_DATA_PREVIOUS_ENCRYPTION_KEYS: ${APP_DATA_PREVIOUS_ENCRYPTION_KEYS:-}
      FREE_DAILY_AGENT_RUN_LIMIT: ${FREE_DAILY_AGENT_RUN_LIMIT:-3}
      PRO_DAILY_AGENT_RUN_LIMIT: ${PRO_DAILY_AGENT_RUN_LIMIT:-50}
      FILL_REVIEW_ARTIFACT_DIR: ${FILL_REVIEW_ARTIFACT_DIR:-storage/fill_review_artifacts}
      FILL_REVIEW_ARTIFACT_RETENTION_DAYS: ${FILL_REVIEW_ARTIFACT_RETENTION_DAYS:-14}
      USE_ALEMBIC_MIGRATIONS: ${USE_ALEMBIC_MIGRATIONS:-true}
      AGENT_RUNNER_MODE: worker
      AGENT_WORKER_POLL_SECONDS: ${AGENT_WORKER_POLL_SECONDS:-2}
      AGENT_WORKER_HEARTBEAT_SECONDS: ${AGENT_WORKER_HEARTBEAT_SECONDS:-10}
      AGENT_WORKER_HEARTBEAT_STALE_SECONDS: ${AGENT_WORKER_HEARTBEAT_STALE_SECONDS:-30}
      AGENT_WORKER_ID: ${AGENT_WORKER_ID:-}
      AGENT_RUN_STALE_MINUTES: ${AGENT_RUN_STALE_MINUTES:-120}
      ENABLE_TRUE_AUTO_SUBMIT: ${ENABLE_TRUE_AUTO_SUBMIT:-false}
      TRUE_SUBMIT_PILOT_USER_EMAILS: ${TRUE_SUBMIT_PILOT_USER_EMAILS:-}
      TRUE_SUBMIT_PILOT_ATS_TYPES: ${TRUE_SUBMIT_PILOT_ATS_TYPES:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      SMTP_EMAIL: ${SMTP_EMAIL:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI:-}
    volumes:
      - fill_review_artifacts:/app/storage/fill_review_artifacts
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
  fill_review_artifacts:
  caddy_data:
  caddy_config:
