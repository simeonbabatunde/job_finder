<!doctype html>
<html lang="en">
  <body>
    <main>
      <form id="application_form">
        <label for="first_name">First name</label>
        <input id="first_name" name="job_application[first_name]" required value="Test" />
        <label for="last_name">Last name</label>
        <input id="last_name" name="job_application[last_name]" required value="User" />
        <label for="email">Email</label>
        <input id="email" name="job_application[email]" type="email" required value="test@example.test" />
        <label for="resume">Resume</label>
        <input id="resume" name="job_application[resume]" type="file" />
        <button id="submit_application" type="submit">Submit Application</button>
      </form>
    </main>
  </body>
</html>
