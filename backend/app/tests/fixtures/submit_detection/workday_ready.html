<!doctype html>
<html>
  <body>
    <main>
      <h1>Senior Software Engineer</h1>
      <form data-automation-id="applicationForm">
        <label for="firstName">First Name</label>
        <input id="firstName" data-automation-id="legalNameSection_firstName" required />
        <label for="lastName">Last Name</label>
        <input id="lastName" data-automation-id="legalNameSection_lastName" required />
        <label for="email">Email</label>
        <input id="email" data-automation-id="email" type="email" required />
        <label for="resume">Resume</label>
        <input id="resume" data-automation-id="file-upload-input-ref" type="file" required />
        <button data-automation-id="bottom-navigation-submit-button" type="submit">
          Submit
        </button>
      </form>
    </main>
  </body>
</html>
