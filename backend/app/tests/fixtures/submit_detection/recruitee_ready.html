<!doctype html>
<html>
  <body>
    <main>
      <h1>Backend Engineer</h1>
      <form id="application-form">
        <label for="candidate_first_name">First name</label>
        <input id="candidate_first_name" name="candidate[first_name]" required>

        <label for="candidate_last_name">Last name</label>
        <input id="candidate_last_name" name="candidate[last_name]" required>

        <label for="candidate_email">Email</label>
        <input id="candidate_email" name="candidate[email]" type="email" required>

        <label for="resume">Resume</label>
        <input id="resume" name="candidate[resume]" type="file" required>

        <label for="cover_letter">Cover letter</label>
        <textarea id="cover_letter" name="candidate[cover_letter]"></textarea>

        <button id="submitApplication" type="submit">Submit Application</button>
      </form>
    </main>
  </body>
</html>
