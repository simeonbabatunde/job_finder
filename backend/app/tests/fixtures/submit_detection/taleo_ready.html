<!doctype html>
<html>
  <body>
    <main>
      <h1>Software Engineer</h1>
      <form id="careerSectionApplication">
        <label for="firstName">First name</label>
        <input id="firstName" name="candidateFirstName" required>

        <label for="lastName">Last name</label>
        <input id="lastName" name="candidateLastName" required>

        <label for="email">Email</label>
        <input id="email" name="candidateEmail" type="email" required>

        <label for="resumeUpload">Resume</label>
        <input id="resumeUpload" name="resumeFile" type="file" required>

        <label for="letter">Cover letter</label>
        <textarea id="letter" name="coverLetter"></textarea>

        <button id="submitApplication" type="submit">Submit Application</button>
      </form>
    </main>
  </body>
</html>
